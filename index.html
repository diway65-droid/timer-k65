<script>
(function(){
  /* ---------- logo ---------- */
  const LOGO = "logo.webp";
  document.querySelectorAll('.club-logo').forEach(img => img.src = LOGO);

  /* ---------- config ---------- */
  const DEFAULTS = { roundMin:3, roundSec:0, restMin:1, restSec:0, rounds:12, prep:10, vol:100, strikes:3, beeps:1, gongSound:'synth' };
  const GONG_SOUNDS = [
    { id:'synth',  label:'Classique' },
    { id:'sound1', label:'Son 1' },
    { id:'sound2', label:'Son 2' },
    { id:'sound3', label:'Son 3' }
  ];

  const SOUND_META = {
    sound1: { src:"sound1.mp3", duration:1.2  },
    sound2: { src:"sound2.mp3", duration:15.7 },
    sound3: { src:"sound3.mp3", duration:54.1 }
  };

  const cfg = Object.assign({}, DEFAULTS);
  try{
    const saved = localStorage.getItem('kb65-timer');
    if(saved) Object.assign(cfg, JSON.parse(saved));
  }catch(e){}
  const draft = Object.assign({}, cfg);
  function saveCfg(){ try{ localStorage.setItem('kb65-timer', JSON.stringify(cfg)); }catch(e){} }

  let roundDuration, restDuration, prepDuration, totalRounds;
  function applyCfg(){
    roundDuration = Math.max(5, cfg.roundMin*60 + cfg.roundSec);
    restDuration  = cfg.restMin*60 + cfg.restSec;
    prepDuration  = cfg.prep;
    totalRounds   = cfg.rounds;
  }
  applyCfg();

  let currentRound = 1;
  let phase = 'idle'; // idle | prep | round | rest | done
  let remaining = roundDuration;
  let running = false, lastTs = null, lastBeepSecond = null, rafId = null;

  /* ---------- DOM ---------- */
  const app = document.getElementById('app');
  const timerEl = document.getElementById('timer');
  const sublabelEl = document.getElementById('sublabel');
  const phasepillEl = document.getElementById('phasepill');
  const roundcountEl = document.getElementById('roundcount');
  const totalroundsEl = document.getElementById('totalrounds');
  const progressBar = document.getElementById('progress-bar');
  const iconPlay = document.getElementById('icon-play');
  const iconPause = document.getElementById('icon-pause');
  const doneScreen = document.getElementById('done-screen');
  const doneSub = document.getElementById('done-sub');
  const strikesNote = document.getElementById('strikes-note');

  function fmt(t){
    t = Math.max(0, Math.ceil(t));
    return String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0');
  }
  function phaseDuration(){
    if(phase==='round') return roundDuration;
    if(phase==='rest')  return restDuration;
    if(phase==='prep')  return prepDuration;
    return roundDuration;
  }

  function flash(){
    app.classList.remove('flash');
    void app.offsetWidth;
    app.classList.add('flash');
  }

  /* =========================================================
     AUDIO
     ========================================================= */
  let actx=null, bus=null, outGain=null;

  function makeSoftClipCurve(amount){
    const n = 2048, curve = new Float32Array(n);
    for(let i=0;i<n;i++){
      const x = (i/(n-1))*2 - 1;
      curve[i] = Math.tanh(x*amount)/Math.tanh(amount);
    }
    return curve;
  }

  function ensureAudio(){
    if(!actx){
      actx = new (window.AudioContext||window.webkitAudioContext)();
      bus = actx.createGain(); bus.gain.value = 1;

      const shaper = actx.createWaveShaper();
      shaper.curve = makeSoftClipCurve(2.4);
      shaper.oversample = '4x';

      const comp = actx.createDynamicsCompressor();
      comp.threshold.value = -20;
      comp.knee.value = 8;
      comp.ratio.value = 14;
      comp.attack.value = 0.002;
      comp.release.value = 0.22;

      const presence = actx.createBiquadFilter();
      presence.type = 'peaking';
      presence.frequency.value = 2600;
      presence.Q.value = 0.9;
      presence.gain.value = 5;

      const limiter = actx.createDynamicsCompressor();
      limiter.threshold.value = -1.5;
      limiter.knee.value = 0;
      limiter.ratio.value = 20;
      limiter.attack.value = 0.001;
      limiter.release.value = 0.12;

      outGain = actx.createGain();
      outGain.gain.value = cfg.vol/100;

      bus.connect(shaper); shaper.connect(comp); comp.connect(presence);
      presence.connect(limiter); limiter.connect(outGain); outGain.connect(actx.destination);

      preloadCustomSounds();
    }
    if(actx.state==='suspended') actx.resume();
    if(outGain) outGain.gain.value = cfg.vol/100;
    return actx;
  }

  const soundBuffers = {};
  const soundLoadPromises = {};
  function loadSound(key){
    if(soundBuffers[key]) return Promise.resolve(soundBuffers[key]);
    if(soundLoadPromises[key]) return soundLoadPromises[key];
    const meta = SOUND_META[key];
    soundLoadPromises[key] = fetch(meta.src)
      .then(r=>r.arrayBuffer())
      .then(ab=>actx.decodeAudioData(ab))
      .then(buf=>{ soundBuffers[key]=buf; return buf; })
      .catch(err=>{ delete soundLoadPromises[key]; throw err; });
    return soundLoadPromises[key];
  }
  function preloadCustomSounds(){
    Object.keys(SOUND_META).forEach(k=> loadSound(k).catch(()=>{}));
  }

  function playCustomGong(key, strong){
    loadSound(key).then(buf=>{
      const ctx = actx;
      const t0 = ctx.currentTime + 0.02;
      const meta = SOUND_META[key];
      // Si la durée est inférieure à 3 secondes, on répète selon cfg.strikes, sinon 1 seule fois
      const reps = (meta.duration <= 3) ? Math.max(1, cfg.strikes) : 1;
      const gap  = meta.duration + 0.12;
      for(let i=0;i<reps;i++){
        const src = ctx.createBufferSource();
        src.buffer = buf;
        const g = ctx.createGain();
        g.gain.value = strong ? 1.0 : 0.95;
        src.connect(g); g.connect(bus);
        src.start(t0 + i*gap);
      }
      flash();
    }).catch(()=>{
      playSynthGong(strong ? Math.max(cfg.strikes,3) : undefined);
    });
  }

  function playSynthGong(strikesCount){
    const ctx = ensureAudio();
    const count = strikesCount !== undefined ? strikesCount : cfg.strikes;
    const t0 = ctx.currentTime + 0.02;
    const freqs = [180, 310, 520, 830];

    for(let s=0; s<count; s++){
      const st = t0 + s * 0.45;
      freqs.forEach((f, idx)=>{
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = idx % 2 === 0 ? 'sine' : 'triangle';
        osc.frequency.setValueAtTime(f, st);
        osc.frequency.exponentialRampToValueAtTime(f * 0.98, st + 0.8);

        g.gain.setValueAtTime(0.001, st);
        g.gain.linearRampToValueAtTime(0.25 / freqs.length, st + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, st + 1.2);

        osc.connect(g);
        g.connect(bus);
        osc.start(st);
        osc.stop(st + 1.25);
      });
    }
    flash();
  }

  function playBeep(isHigh){
    const ctx = ensureAudio();
    const t = ctx.currentTime;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(isHigh ? 880 : 440, t);
    g.gain.setValueAtTime(0.2, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    osc.connect(g);
    g.connect(bus);
    osc.start(t);
    osc.stop(t + 0.13);
  }

  function triggerGong(strong){
    ensureAudio();
    if(cfg.gongSound === 'synth'){
      playSynthGong(strong ? Math.max(cfg.strikes, 3) : cfg.strikes);
    } else {
      playCustomGong(cfg.gongSound, strong);
    }
  }

  /* ---------- Cycle du timer ---------- */
  function updateTheme(){
    app.classList.remove('danger');
    if(phase === 'idle'){
      app.style.setProperty('--phase-bg', 'var(--bg-idle)');
      app.style.setProperty('--phase-bg-2', 'var(--bg-round-2)');
      phasepillEl.textContent = 'PRÊT';
      phasepillEl.style.background = 'var(--accent-gold)';
    } else if(phase === 'prep'){
      app.style.setProperty('--phase-bg', 'var(--bg-prep)');
      app.style.setProperty('--phase-bg-2', 'var(--bg-prep-2)');
      phasepillEl.textContent = 'PRÉPARATION';
      phasepillEl.style.background = '#d99b16';
    } else if(phase === 'round'){
      app.style.setProperty('--phase-bg', 'var(--bg-round)');
      app.style.setProperty('--phase-bg-2', 'var(--bg-round-2)');
      phasepillEl.textContent = 'COMBAT';
      phasepillEl.style.background = 'var(--accent-gold)';
      if(remaining <= 10 && running) app.classList.add('danger');
    } else if(phase === 'rest'){
      app.style.setProperty('--phase-bg', 'var(--bg-rest)');
      app.style.setProperty('--phase-bg-2', 'var(--bg-rest-2)');
      phasepillEl.textContent = 'REPOS';
      phasepillEl.style.background = '#28a745';
      if(remaining <= 10 && running) app.classList.add('danger');
    }
  }

  function render(){
    timerEl.textContent = fmt(remaining);
    roundcountEl.innerHTML = `Round <b>${currentRound}</b> / <span id="totalrounds">${totalRounds}</span>`;
    const dur = phaseDuration();
    const pct = dur > 0 ? Math.max(0, Math.min(100, (remaining / dur) * 100)) : 0;
    progressBar.style.width = pct + '%';
    updateTheme();
  }

  function nextPhase(){
    if(phase === 'idle' || phase === 'prep'){
      phase = 'round';
      remaining = roundDuration;
      sublabelEl.textContent = 'Boxez !';
      triggerGong(false);
    } else if(phase === 'round'){
      if(currentRound >= totalRounds){
        phase = 'done';
        running = false;
        triggerGong(true);
        doneSub.textContent = `${totalRounds} rounds terminés. Beau travail !`;
        doneScreen.classList.add('open');
        updatePlayState();
        return;
      }
      phase = 'rest';
      remaining = restDuration;
      sublabelEl.textContent = 'Respirez et récupérez';
      triggerGong(false);
    } else if(phase === 'rest'){
      currentRound++;
      phase = 'round';
      remaining = roundDuration;
      sublabelEl.textContent = 'Boxez !';
      triggerGong(false);
    }
    lastBeepSecond = null;
    render();
  }

  function loop(ts){
    if(!running) return;
    if(lastTs === null) lastTs = ts;
    const delta = (ts - lastTs) / 1000;
    lastTs = ts;
    remaining -= delta;

    const secCeil = Math.ceil(remaining);
    if(cfg.beeps && secCeil <= 5 && secCeil >= 1 && secCeil !== lastBeepSecond){
      lastBeepSecond = secCeil;
      playBeep(secCeil === 1);
    }

    if(remaining <= 0){
      nextPhase();
    }
    render();
    if(running) rafId = requestAnimationFrame(loop);
  }

  function updatePlayState(){
    if(running){
      iconPlay.style.display = 'none';
      iconPause.style.display = 'block';
    } else {
      iconPlay.style.display = 'block';
      iconPause.style.display = 'none';
    }
  }

  function togglePlay(){
    ensureAudio();
    running = !running;
    if(running){
      if(phase === 'idle'){
        if(prepDuration > 0){
          phase = 'prep';
          remaining = prepDuration;
          sublabelEl.textContent = 'Préparez-vous...';
        } else {
          phase = 'round';
          remaining = roundDuration;
          sublabelEl.textContent = 'Boxez !';
          triggerGong(false);
        }
      }
      lastTs = null;
      rafId = requestAnimationFrame(loop);
    } else {
      if(rafId) cancelAnimationFrame(rafId);
      lastTs = null;
    }
    updatePlayState();
    render();
  }

  function resetAll(){
    running = false;
    if(rafId) cancelAnimationFrame(rafId);
    lastTs = null;
    phase = 'idle';
    currentRound = 1;
    remaining = roundDuration;
    sublabelEl.textContent = 'Appuyez sur lecture pour démarrer';
    doneScreen.classList.remove('open');
    updatePlayState();
    render();
  }

  /* ---------- Événements boutons ---------- */
  document.getElementById('playpause').addEventListener('click', togglePlay);
  document.getElementById('reset-btn').addEventListener('click', resetAll);
  document.getElementById('done-reset-btn').addEventListener('click', resetAll);
  document.getElementById('next-btn').addEventListener('click', ()=>{
    if(phase !== 'done') nextPhase();
  });
  document.getElementById('gong-btn').addEventListener('click', ()=> triggerGong(false));
  document.getElementById('test-gong').addEventListener('click', ()=> triggerGong(false));

  document.getElementById('fs-btn').addEventListener('click', ()=>{
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(()=>{});
    } else {
      document.exitFullscreen().catch(()=>{});
    }
  });

  /* ---------- Modale Réglages ---------- */
  const overlay = document.getElementById('overlay');
  function updateDraftUI(){
    document.getElementById('val-roundMin').textContent = draft.roundMin + ' min';
    document.getElementById('val-roundSec').textContent = String(draft.roundSec).padStart(2,'0') + ' s';
    document.getElementById('val-restMin').textContent = draft.restMin + ' min';
    document.getElementById('val-restSec').textContent = String(draft.restSec).padStart(2,'0') + ' s';
    document.getElementById('val-rounds').textContent = draft.rounds;
    document.getElementById('val-prep').textContent = draft.prep + ' s';
    document.getElementById('val-vol').textContent = draft.vol + ' %';
    document.getElementById('val-beeps').textContent = draft.beeps ? 'Oui' : 'Non';

    const curS = GONG_SOUNDS.find(s=>s.id === draft.gongSound) || GONG_SOUNDS[0];
    document.getElementById('val-gongSound').textContent = curS.label;

    const meta = SOUND_META[draft.gongSound];
    if(meta && meta.duration > 3){
      strikesNote.style.display = 'inline';
    } else {
      strikesNote.style.display = 'none';
    }
    document.getElementById('val-strikes').textContent = draft.strikes;
  }

  document.getElementById('settings-btn').addEventListener('click', ()=>{
    Object.assign(draft, cfg);
    updateDraftUI();
    overlay.classList.add('open');
  });
  document.getElementById('cancel-btn').addEventListener('click', ()=> overlay.classList.remove('open'));

  document.getElementById('apply-btn').addEventListener('click', ()=>{
    Object.assign(cfg, draft);
    saveCfg();
    applyCfg();
    overlay.classList.remove('open');
    if(!running && phase === 'idle'){
      remaining = roundDuration;
      render();
    }
  });

  overlay.addEventListener('click', (e)=>{
    const btn = e.target.closest('button[data-target]');
    if(!btn) return;
    const field = btn.dataset.target;
    const step = parseInt(btn.dataset.step, 10);

    if(field === 'roundMin') draft.roundMin = Math.max(0, Math.min(59, draft.roundMin + step));
    if(field === 'roundSec') draft.roundSec = (draft.roundSec + step + 60) % 60;
    if(field === 'restMin')  draft.restMin = Math.max(0, Math.min(59, draft.restMin + step));
    if(field === 'restSec')  draft.restSec = (draft.restSec + step + 60) % 60;
    if(field === 'rounds')   draft.rounds = Math.max(1, Math.min(99, draft.rounds + step));
    if(field === 'prep')     draft.prep = Math.max(0, Math.min(60, draft.prep + step));
    if(field === 'vol')      draft.vol = Math.max(0, Math.min(100, draft.vol + step));
    if(field === 'strikes')  draft.strikes = Math.max(1, Math.min(10, draft.strikes + step));
    if(field === 'beeps')    draft.beeps = draft.beeps ? 0 : 1;

    if(field === 'gongSound'){
      let idx = GONG_SOUNDS.findIndex(s=>s.id === draft.gongSound);
      idx = (idx + step + GONG_SOUNDS.length) % GONG_SOUNDS.length;
      draft.gongSound = GONG_SOUNDS[idx].id;
    }
    updateDraftUI();
  });

  render();
})();
</script>
